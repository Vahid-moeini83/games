<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کتابخونه بازی من</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&family=Baloo+2:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="console">
      <header class="console-header">
        <span class="tag">لیست بازی های من 🎮</span>
        <h1>کتابخونه بازی من</h1>
        <p class="subtitle">بازی‌هات رو اضافه کن، پیگیری کن، تمومشون کن</p>
      </header>

      <div class="stats-row">
        <div class="stat stat-playing">
          <span class="stat-num js-playing-count">۰</span>
          <span class="stat-label">در حال بازی</span>
        </div>
        <div class="stat stat-done">
          <span class="stat-num js-done-count">۰</span>
          <span class="stat-label">تموم شده</span>
        </div>
        <div class="stat stat-total">
          <span class="stat-num js-total-count">۰</span>
          <span class="stat-label">کل بازی‌ها</span>
        </div>
      </div>

      <div class="add-row">
        <input
          type="text"
          class="js-game-input"
          placeholder="اسم بازی جدید رو بنویس..."
          autocomplete="off"
        />
        <button class="js-add-btn add-btn">
          <span>افزودن</span>
        </button>
      </div>

      <ul class="game-list js-game-list">
        <!-- کارت‌های بازی اینجا با JS اضافه می‌شن -->
      </ul>

      <p class="empty-state js-empty-state">هنوز بازی‌ای اضافه نکردی 🕹️</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
